[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm_intercept"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy<2", "scipy", "matplotlib", "pyyaml"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3", "torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["swarm_intercept*"]
